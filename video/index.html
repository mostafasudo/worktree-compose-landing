        --color-warn: #e3b341;
        --font-display: "Hanken Grotesk";
        --font-code: "JetBrains Mono";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--color-ground);
        font-family: var(--font-display), sans-serif;
