  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);
      const CW = 32 * 0.6;

      // From the spawn scene's last frame: its four commands clear, the line changes.
      tl.set("#t-oldcur", { opacity: 1 }, 0);
      tl.to("#t-old", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 0.05);
      tl.to("#t-head-a > span", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 0.05);
      tl.fromTo("#t-head-b > span", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power4.out" }, 0.22);

      // Hidden until their moment.
      tl.set(["#t-lane1 .t-wt", "#t-lane2 .t-wt", "#t-lane3 .t-wt", "#t-lane4 .t-wt"], { opacity: 0 }, 0);
      tl.set([".t-proj", ".t-port", ".t-st"], { opacity: 0 }, 0);
      for (let k = 0; k <= 20; k++) tl.set("#t-o" + k, { opacity: 0 }, 0);

      // $ wtc start
      const n = q("#t-cmd").textContent.length;
      tl.set("#t-o0", { opacity: 1 }, 0.26);
      tl.fromTo("#t-cmd", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: n / 34, ease: "steps(" + n + ")" }, 0.3);
      tl.fromTo("#t-cur", { x: 0 }, { x: n * CW, duration: n / 34, ease: "steps(" + n + ")" }, 0.3);
      tl.set("#t-cur", { opacity: 0 }, 0.67);

      // The output streams; the view scrolls a line at a time like a terminal.
      const T0 = 0.7;
      const STEP = 0.1;
      for (let k = 1; k <= 20; k++) {
        const t = T0 + (k - 1) * STEP;
        tl.set("#t-o" + k, { opacity: 1 }, t);
        if (k >= 4) tl.set("#t-out", { y: -(k - 3) * 48 }, t);
      }
      tl.set("#t-out", { y: 0 }, 0);

      // Each lane fills as its worktree reports: index, project, port, status.
      for (let i = 1; i <= 4; i++) {
        const lane = "#t-lane" + i;
        const tProj = T0 + (2 + 5 * (i - 1) - 1) * STEP;
        const tUp = T0 + (5 + 5 * (i - 1) - 1) * STEP;
        tl.fromTo(lane + " .t-wt", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, tProj);
        tl.to(lane + " .t-path", { opacity: 0, filter: "blur(6px)", duration: 0.15 }, tProj);
        tl.fromTo(lane + " .t-proj", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, tProj + 0.1);
        tl.to(lane + " .t-none", { opacity: 0, filter: "blur(6px)", duration: 0.15 }, tUp - 0.05);
        tl.fromTo(
          lane + " .t-port",
          { y: 23, opacity: 0, filter: "blur(6px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
          tUp,
        );
        tl.fromTo(lane + " .t-st", { opacity: 0 }, { opacity: 1, duration: 0.15 }, tUp + 0.12);
      }

      // Lane 4's port lands at ~3.0 s and the four ports hold together for ~1.7 s.
      // start ends by printing the list itself: the lanes give way to its table.
      tl.to(["#t-panel", "#t-lane1", "#t-lane2", "#t-lane3", "#t-lane4"], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in", stagger: 0.02 }, 4.75);
      tl.fromTo("#t-list", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.35, ease: "power3.out" }, 4.85);
      tl.fromTo("#t-tail", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 4.92);
      for (let r = 0; r <= 12; r++) tl.fromTo("#t-r" + r, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 4.96 + r * 0.02);

      // The full table holds ~1.5 s (ENV_VAR=port rows readable), then the Ports column
      // leaves as the camera pushes in on Index to URL: the table's own text, 29 px on screen.
      tl.to("#t-head-b > span", { opacity: 0, filter: "blur(8px)", duration: 0.2 }, 6.6);
      tl.to(".t-pc", { opacity: 0, duration: 0.25, ease: "power2.out" }, 6.75);
      tl.set("#t-cam", { transformOrigin: "124px 520px" }, 0);
      tl.fromTo("#t-cam", { scale: 1 }, { scale: 1.28, duration: 0.6, ease: "power2.inOut" }, 6.75);

      // Hand-off: everything but the four URLs fades; the overlays hold their place.
      tl.set(["#t-url1", "#t-url2", "#t-url3", "#t-url4"], { opacity: 0 }, 0);
      tl.set(["#t-url1", "#t-url2", "#t-url3", "#t-url4"], { opacity: 1 }, 7.4);
      tl.set(".t-cell", { opacity: 0 }, 7.4);
      tl.to("#t-cam", { opacity: 0, duration: 0.25, ease: "power2.in" }, 7.72);
      tl.to({}, { duration: 0.01 }, 7.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["start"] = tl;
    })();
  </script>
