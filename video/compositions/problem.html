  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);
      const rise = (id, at) =>
        tl.fromTo(q(id + " > span"), { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "power4.out" }, at);

      // Frame 0 is the thumbnail: line one, main's 5173 and its status are already there.
      tl.set(["#p-l1 > span", "#p-l2 > span", "#p-l3 > span", "#p-l4 > span"], { yPercent: 105 }, 0);

      rise("#p-l1", 0.3);

      // The worktree's 5173 whips in from the right.
      tl.fromTo(
        "#p-num-wt",
        { x: 420, opacity: 0, filter: "blur(14px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
        0.55,
      );
      tl.fromTo("#p-cap-wt", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.75);
      tl.set("#p-st-wt", { opacity: 0 }, 0);

      rise("#p-l2", 1.05);

      // It runs the same compose up.
      const tx = q("#p-cmd-tx");
      const n = tx.textContent.length;
      const cw = 30 * 0.6;
      tl.fromTo("#p-cmd", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.3);
      tl.fromTo(tx, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: n / 34, ease: "steps(" + n + ")" }, 1.4);
      tl.fromTo("#p-cursor", { x: 0 }, { x: n * cw, duration: n / 34, ease: "steps(" + n + ")" }, 1.4);

      rise("#p-l3", 1.85);

      // The bind fails: the number and the status turn red, the daemon's error prints.
      tl.to("#p-num-wt-digits", { color: "#f85149", duration: 0.12, ease: "none" }, 2.4);
      tl.set("#p-cursor", { opacity: 0 }, 2.4);
      tl.set("#p-st-wt", { opacity: 1 }, 2.4);
      tl.fromTo("#p-err1", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.4);
      tl.fromTo("#p-err2", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.47);

      rise("#p-l4", 2.8);

      // Hand-off: everything but the two numbers blurs away; the numbers stay for the fix.
      const outs = ["#p-l0", "#p-l1", "#p-l2", "#p-l3", "#p-l4", "#p-cap-main", "#p-cap-wt", "#p-cmd", "#p-err1", "#p-err2"];
      outs.forEach((s, i) =>
        tl.to(s, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 5.3 + i * 0.03),
      );
      tl.to({}, { duration: 0.01 }, 5.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["problem"] = tl;
    })();
